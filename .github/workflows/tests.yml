name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NETOPS_POLL_ENABLED: "false"
      AGENTIC_NETOPS_LIVE_CISCO_TEST: "0"
      AGENTIC_NETOPS_LIVE_TEST: "0"
      AGNETNETOPS_LIVE_TEST: "0"
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m pytest -q
