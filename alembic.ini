# Alembic configuration for Agentic NetOps database migrations.

[alembic]
# Ensure the repository root is importable when Alembic is launched through
# the console-script entry point (for example, .venv\Scripts\alembic.exe).
prepend_sys_path = .

# Use the platform-native path separator for path lists such as
# prepend_sys_path and version_locations.
path_separator = os

# path to migration scripts
script_location = alembic

# database URL (set via environment variable NETOPS_DATABASE_URL)
sqlalchemy.url =

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file
# timezone =

# max length of characters to apply to the version
# file name
# max_file_name_length = 50

# version location separator; default: os.sep
# version_path_separator = os.sep

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# whenever a new revision file is created.

# Uncomment the line below to run the "black" code formatter
# on newly generated revision files.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILE

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
